<!-- Header / Topbar -->
<header class="topbar">
  <div class="topbar-left">
    <div class="topbar-title" id="topbar-title" data-i18n="nav.setup">Setup</div>
    <div class="topbar-sub" id="topbar-sub" data-i18n="setup.subtitle">Pair your mobile device with this computer to begin.</div>
  </div>
  <div class="topbar-right">
    <div class="status-pill disconnected" id="connection-pill">
      <span class="dot"></span> <span id="connection-text" data-i18n="status.disconnected">Disconnected</span>
    </div>
    <button class="btn icon" id="btn-theme" title="Change theme"><i data-lucide="sun" class="ic" id="theme-icon"></i></button>
    <button class="btn icon" id="btn-language" title="Change language"><i data-lucide="languages" class="ic"></i></button>
  </div>
</header>
